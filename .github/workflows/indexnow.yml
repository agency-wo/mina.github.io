# [CFG-011] indexnow.yml — after each GitHub Pages build, tell the IndexNow engines what changed.
#
# Runs tools/indexnow_ping.py [API-007] on page_build, i.e. once Pages has published, so Bing
# fetches the new version rather than the old one. The script sends the sitemap URLs whose
# lastmod is today or yesterday in one request and always exits 0: a ping is a hint, never a
# gate, so this workflow can never go red because an engine was down.
# workflow_dispatch is there to send a ping by hand from the Actions tab.
name: indexnow
on:
  page_build:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping IndexNow with the pages that changed
        run: python3 tools/indexnow_ping.py
